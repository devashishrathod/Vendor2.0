<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trydood Vendors</title>
    <meta
      name="description"
      content="Trydood Vendor Panel — onboard your business, manage outlets, vouchers, transactions and settlements in one place."
    />
    <meta name="theme-color" content="#09B285" />

    <link rel="icon" type="image/png" href="/src/assets/Icon.png" />
    <link rel="apple-touch-icon" href="/src/assets/Icon.png" />

    <!-- Link previews (WhatsApp, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trydood" />
    <meta property="og:title" content="Trydood Vendors" />
    <meta
      property="og:description"
      content="Onboard your business on Trydood and manage outlets, vouchers and settlements in one place."
    />

    <!-- Apply the saved dark theme before first paint so dark-mode users
         don't see a white flash (ThemeContext.jsx takes over after mount). -->
    <script>
      try {
        if (localStorage.getItem('trydood-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>

    <!-- Google tag (gtag.js) -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X98017FJX7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // SPA: page views are sent manually on every route change by
      // src/routes/AnalyticsRouteTracker.jsx, so the automatic one is off.
      gtag('config', 'G-X98017FJX7', { send_page_view: false });
    </script>

    <!-- Fonts: Plus Jakarta Sans (UI) + DM Serif Display (headings) —
         the --font-sans / --font-display tokens in src/index.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>Trydood Vendor Panel needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
